name: Security migration

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/security-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Define supported security-patched dependency graph
        run: |
          npm pkg delete 'dependencies.@reach/rect'
          npm pkg delete 'dependencies.marqy'
          npm pkg set \
            'dependencies.next=15.5.24' \
            'dependencies.react=18.2.0' \
            'dependencies.react-dom=18.2.0' \
            'dependencies.axios=1.20.0' \
            'dependencies.embla-carousel-react=8.6.0' \
            'devDependencies.@next/bundle-analyzer=15.5.24' \
            'devDependencies.postcss=8.5.23' \
            'devDependencies.typescript=5.9.2' \
            'devDependencies.@types/node=22.18.6' \
            'devDependencies.@types/react=18.3.24' \
            'devDependencies.@types/react-dom=18.3.7' \
            'overrides.postcss=8.5.23'
      - name: Resolve dependency graph
        run: npm install --ignore-scripts
      - name: Regression contracts
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production storefront build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency graph
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json tsconfig.json next-env.d.ts
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
            exit 0
          fi
          git commit -m 'security: migrate storefront to patched runtime'
          git push origin HEAD:portfolio-improvements-2026-08
